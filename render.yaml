# BMS Watch on Render's free tier as a single web service.
# Watches live in Supabase (schema bms_watch); the container disk only caches film lists.
services:
  - type: web
    name: bms-watch
    runtime: docker
    plan: free
    region: singapore # next to the Supabase project (ap-southeast-1)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: ORIGIN
        value: https://bms-watch.onrender.com
      - key: DATA_DIR
        value: /data
      # Supabase Auth & User Database (Shared with evenly)
      - key: SUPABASE_URL
        value: https://ismyhkcsxrswqsfzfrxe.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      # Comma-separated Supabase user ids or emails who see and manage every watch
      - key: ADMIN_UID
        sync: false
      # Shared secret for /api/cron (cron-job.org calls /api/cron every 5 min)
      - key: CRON_SECRET
        sync: false
      # Supabase server key: the app reads and writes watches through Supabase's REST API
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Email SMTP settings (entered in Render dashboard)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
