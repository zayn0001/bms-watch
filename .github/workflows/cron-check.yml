name: BMS Watch Scheduled Check

on:
  schedule:
    # Runs every 10 minutes to keep Render alive and check for ticket drops
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger BMS Watch Check & Prevent Sleep
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL || 'https://bms-watch.onrender.com' }}
        run: |
          echo "Pinging $APP_URL/api/cron..."
          curl -s -f -m 30 "$APP_URL/api/cron" || echo "Service waking up or unreachable"
