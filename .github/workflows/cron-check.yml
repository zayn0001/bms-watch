name: BMS Watch Scheduled Check

# Asks the Render app to run a check. The check runs on Render against its own database,
# so nothing here touches the data. Every 5 minutes (GitHub's shortest) also keeps the free Render service
# from sleeping (it sleeps after 15 idle minutes).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Run workflow button in the Actions tab

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron (wakes Render if asleep)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # A sleeping Render service takes 30-60s to start, hence the long timeout and retries.
        run: |
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "X-Cron-Secret: $CRON_SECRET" \
            https://bms-watch.onrender.com/api/cron
